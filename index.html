<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K1 Management Systems</title>
<style>
:root{--blue:#0967d8;--ink:#101820;--bg:#f4f6f8;--good:#16803b;--bad:#d92d20}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;background:#0c1117;color:var(--ink)}
button,input,select,textarea{font:inherit}.app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:84px}
.top{background:linear-gradient(135deg,#0b1118,#15202b);background-size:cover;background-position:center;color:#fff;padding:18px;position:sticky;top:0;z-index:5}
.top.hasPhoto:before{content:'';position:absolute;inset:0;background:#07111daa}.top>*{position:relative;z-index:1}
.brand{display:flex;justify-content:space-between;align-items:center}.k1{font-weight:900;font-size:26px}.venueLogo{width:54px;height:54px;border:1px solid #506070;border-radius:10px;background:#111b25;display:grid;place-items:center;overflow:hidden;font-size:9px;text-align:center}
.venueLogo img{width:100%;height:100%;object-fit:contain;background:#fff}.venue select{width:100%;margin-top:12px;padding:10px;border-radius:9px;border:1px solid #536171;background:#111b25;color:#fff}
.customize{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:11px}.customize input{width:100%;font-size:10px}
.content{padding:14px}.screen{display:none}.screen.active{display:block}.hero{background:linear-gradient(135deg,#0a4f9d,#0d76e8);color:#fff;border-radius:16px;padding:16px}.hero h2{margin:2px 0}
.grid,.quick,.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid{margin-top:12px}.card,.row{background:#fff;border:1px solid #e0e4e9;border-radius:14px;padding:14px}.row{margin:8px 0;display:flex;align-items:center;gap:10px;justify-content:space-between}.rowMain{flex:1}
.metric{font-size:28px;font-weight:800}.good{color:var(--good)}.bad{color:var(--bad)}.small{font-size:12px;color:#64748b}.hero .small{color:#dbeafe}
.bar{height:7px;background:#e7ebef;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--blue)}
.sectionTitle{font-weight:800;margin:18px 2px 9px;display:flex;justify-content:space-between;align-items:center}.pill{font-size:11px;padding:4px 7px;border-radius:20px;background:#e8f2ff;color:#0759b5;white-space:nowrap}.pill.red{background:#feeceb;color:#b42318}.pill.green{background:#e8f7ed;color:#147a35}
.btn{border:0;border-radius:10px;padding:12px 14px;background:var(--blue);color:#fff;font-weight:700}.btn.secondary{background:#e9edf2;color:#18212a}.btn.dark{background:#111820}.full{width:100%}.quick button{min-height:64px}
.form label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}.form input,.form select,.form textarea{width:100%;border:1px solid #ccd3db;border-radius:9px;padding:11px;background:#fff}.form textarea{min-height:90px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:72px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav button{border:0;background:#fff;font-size:10px}.nav b{display:block;font-size:20px}.nav .active{color:var(--blue)}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#111820;color:#fff;padding:11px 15px;border-radius:10px;display:none;z-index:30;width:calc(100% - 36px);max-width:430px;text-align:center}
.modal{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:end;justify-content:center}.sheet{background:#fff;width:min(480px,100%);padding:20px;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto}
.check{width:22px;height:22px}.detail{padding:9px 0;border-bottom:1px solid #e5e7eb}.note{background:#f8fafc;border-left:3px solid var(--blue);padding:10px;margin:8px 0;border-radius:6px}
</style></head>
<body><div class="app">
<header class="top">
<div class="brand"><div><div class="k1">K1</div><div style="font-size:10px;letter-spacing:1.5px">MANAGEMENT SYSTEMS</div></div><div class="venueLogo" id="venueLogo">BOEING<br>CENTER<br>AT TECH PORT</div></div>
<div class="venue"><select><option>Boeing Center at Tech Port — San Antonio</option></select></div>
<div class="customize"><label>Venue logo<input id="logoUpload" type="file" accept="image/*"></label><label>Header photo<input id="headerUpload" type="file" accept="image/*"></label></div>
</header>
<main class="content">
<section id="home" class="screen active">
<div class="hero"><div class="small">VENUE FACILITIES</div><h2>Good morning, Shane</h2><div>Maintenance overview</div></div>
<div class="grid">
<div class="card"><div class="small">RM COMPLETION</div><div id="rmPct" class="metric">0%</div><div class="bar"><i id="rmBar"></i></div></div>
<div class="card"><div class="small">PM COMPLIANCE</div><div id="pmPct" class="metric">0%</div><div class="bar"><i id="pmBar"></i></div></div>
<div class="card"><div class="small">OPEN WORK ORDERS</div><div id="openCount" class="metric">0</div><div id="overdueCount" class="small bad"></div></div>
<div class="card"><div class="small">ASSETS</div><div id="assetCount" class="metric">0</div><div class="small">Venue equipment</div></div>
</div>
<div class="sectionTitle">Upcoming work</div><div id="upcoming"></div>
<div class="sectionTitle">Quick actions</div><div class="quick">
<button class="btn" onclick="openWO('Reactive Maintenance')">＋ RM Work Order</button><button class="btn" onclick="openWO('Preventive Maintenance')">＋ PM Work Order</button>
<button class="btn dark" onclick="show('assets')">⚙ Assets</button><button class="btn secondary" onclick="show('workorders')">☷ Work Orders</button>
<button class="btn secondary" onclick="openAssetCreate()">＋ New Asset</button><button class="btn secondary" onclick="toast('Calendar / Outlook remains available for the next integration step')">▦ Calendar</button>
</div></section>

<section id="workorders" class="screen">
<div class="sectionTitle"><span>Work Orders</span><button class="btn" onclick="openWO('Reactive Maintenance')">＋ New</button></div>
<div class="actions"><button id="selectBtn" class="btn secondary" onclick="toggleSelect()">Select Multiple</button><button id="closeSelected" class="btn dark" style="display:none" onclick="bulkClose()">Close Selected</button></div>
<div id="woList"></div></section>

<section id="woCreate" class="screen"><button class="btn secondary" onclick="show('workorders')">← Cancel</button><h2>Create Work Order</h2><div class="form">
<label>Work Type</label><select id="fType"><option>Reactive Maintenance</option><option>Preventive Maintenance</option><option>Upgrade / Project</option><option>Inspection</option><option>Event Work</option></select>
<label>Title *</label><input id="fTitle"><label>Asset</label><select id="fAsset"></select><label>Location *</label><input id="fLocation">
<label>Priority</label><select id="fPriority"><option>Low</option><option selected>Normal</option><option>High</option><option>Critical</option></select>
<label>Assigned To</label><select id="fAssigned"><option>Shane Kelley</option><option>Jordan Lee</option><option>Chris Taylor</option><option>Vendor / Contractor</option><option>Unassigned</option></select>
<label>Scheduled Date</label><input id="fScheduled" type="date"><label>Due Date</label><input id="fDue" type="date"><label>Description / Scope</label><textarea id="fDescription"></textarea>
<button class="btn full" style="margin-top:16px" onclick="createWO()">Create & Open Work Order</button></div></section>

<section id="woDetail" class="screen"><div id="woDetailBody"></div></section>

<section id="assets" class="screen">
<div class="sectionTitle"><span>Assets</span><button class="btn" onclick="openAssetCreate()">＋ New Asset</button></div><div id="assetList"></div></section>

<section id="assetCreate" class="screen"><button class="btn secondary" onclick="show('assets')">← Cancel</button><h2>Add New Asset</h2><div class="form">
<label>Asset ID / Tag *</label><input id="aId" placeholder="AHU-05"><label>Asset Name *</label><input id="aName">
<label>Category / System</label><select id="aCategory"><option>HVAC</option><option>Electrical</option><option>Plumbing</option><option>Kitchen Equipment</option><option>Retractable Seating</option><option>Concert / Event Equipment</option><option>Exterior / Lighting</option><option>Landscaping</option><option>Heavy Machinery</option><option>Building / Architectural</option><option>Life Safety</option><option>Other</option></select>
<label>Area / Location</label><input id="aLocation"><label>Manufacturer</label><input id="aManufacturer"><label>Model</label><input id="aModel"><label>Serial Number</label><input id="aSerial">
<label>Criticality</label><select id="aCriticality"><option>Normal</option><option>High</option><option>Critical</option></select><label>Status</label><select id="aStatus"><option>Operational</option><option>Limited Service</option><option>Out of Service</option></select>
<label>Vendor</label><input id="aVendor"><label>Notes</label><textarea id="aNotes"></textarea><button class="btn full" style="margin-top:16px" onclick="saveAsset()">Save Asset</button>
</div></section>
</main>
<nav class="nav"><button class="active" onclick="show('home',this)"><b>⌂</b>Home</button><button onclick="show('workorders',this)"><b>＋</b>Work Orders</button><button onclick="show('assets',this)"><b>⚙</b>Assets</button><button onclick="toast('Maintenance Requests retained for next module update')"><b>☵</b>Request</button><button onclick="toast('More modules coming next')"><b>☰</b>More</button></nav>
</div><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="sheet"><div id="modalBody"></div></div></div>
<script>
const seedWO=[
{id:'BCTP-PM-1045',type:'Preventive Maintenance',title:'AHU-04 Quarterly Service',asset:'AHU-04',location:'Mechanical Room 204',priority:'Normal',assigned:'Shane Kelley',status:'Scheduled',due:'2026-09-29',overdue:false,notes:[],labor:[],parts:[]},
{id:'BCTP-RM-2481',type:'Reactive Maintenance',title:'Concourse Lighting Issue',asset:'CL-12',location:'Concourse',priority:'High',assigned:'Jordan Lee',status:'In Progress',due:'2026-09-25',overdue:true,notes:[],labor:[],parts:[]},
{id:'BCTP-UP-0127',type:'Upgrade / Project',title:'Backstage LED Upgrade',asset:'',location:'Backstage',priority:'Normal',assigned:'Vendor / Contractor',status:'Scheduled',due:'2026-10-02',overdue:false,notes:[],labor:[],parts:[]}
];
const seedAssets=[
{id:'AHU-04',name:'Air Handling Unit 04',category:'HVAC',location:'Mechanical Room 204',manufacturer:'Trane',model:'TAHC-1200',serial:'',criticality:'High',status:'Operational',vendor:'CoolAir Services',notes:''},
{id:'RTS-01',name:'Retractable Seating',category:'Retractable Seating',location:'Arena Bowl',status:'Operational'},
{id:'GEN-01',name:'Emergency Generator',category:'Electrical',location:'Exterior Yard',status:'Operational'},
{id:'FRY-03',name:'Kitchen Fryer',category:'Kitchen Equipment',location:'Main Kitchen',status:'Out of Service'}
];
let workOrders=JSON.parse(localStorage.getItem('k1_workorders')||'null')||seedWO;
let assets=JSON.parse(localStorage.getItem('k1_assets')||'null')||seedAssets;
let activeWO=null, selecting=false, selected=new Set();

function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function save(){localStorage.setItem('k1_workorders',JSON.stringify(workOrders));localStorage.setItem('k1_assets',JSON.stringify(assets))}
function show(id,btn){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(btn){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}window.scrollTo(0,0)}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function render(){
 let closed=w=>['Completed','Verified / Closed'].includes(w.status), active=workOrders.filter(w=>!closed(w));
 let rm=workOrders.filter(w=>w.type==='Reactive Maintenance'),pm=workOrders.filter(w=>w.type==='Preventive Maintenance');
 let rp=rm.length?Math.round(rm.filter(closed).length/rm.length*100):100, pp=pm.length?Math.round(pm.filter(closed).length/pm.length*100):100;
 rmPct.textContent=rp+'%';pmPct.textContent=pp+'%';rmBar.style.width=rp+'%';pmBar.style.width=pp+'%';openCount.textContent=active.length;overdueCount.textContent=active.filter(w=>w.overdue).length+' overdue';assetCount.textContent=assets.length;
 upcoming.innerHTML=active.slice(0,3).map(w=>`<div class="row"><div><strong>${esc(w.title)}</strong><div class="small">${esc(w.id)} · Due ${esc(w.due||'Unscheduled')}</div></div><span class="pill ${w.overdue?'red':''}">${esc(w.status)}</span></div>`).join('');
 woList.innerHTML=workOrders.map(w=>`<div class="row">${selecting?`<input class="check" type="checkbox" ${selected.has(w.id)?'checked':''} onchange="selectWO('${w.id}',this.checked)">`:''}<div class="rowMain" onclick="openDetail('${w.id}')"><strong>${esc(w.id)}</strong><div>${esc(w.title)}</div><div class="small">${esc(w.type)} · ${esc(w.asset||'Facility')}</div></div><span class="pill ${w.overdue?'red':closed(w)?'green':''}">${esc(w.status)}</span></div>`).join('');
 assetList.innerHTML=assets.map(a=>`<div class="row"><div class="rowMain"><strong>${esc(a.id)} — ${esc(a.name)}</strong><div class="small">${esc(a.category||'Other')} · ${esc(a.location||'No location')}</div></div><button class="btn secondary" onclick="openWO('Reactive Maintenance','${esc(a.id)}')">Create WO</button></div>`).join('');
}
function fillAssets(){fAsset.innerHTML='<option value="">Facility / General</option>'+assets.map(a=>`<option value="${esc(a.id)}">${esc(a.id)} — ${esc(a.name)}</option>`).join('')}
function openWO(type,asset=''){fillAssets();fType.value=type;fAsset.value=asset;fTitle.value='';fLocation.value=asset?(assets.find(a=>a.id===asset)?.location||''):'';fPriority.value='Normal';fAssigned.value='Shane Kelley';fScheduled.value='';fDue.value='';fDescription.value='';show('woCreate')}
function newId(type){let p=type.startsWith('Preventive')?'PM':type.startsWith('Upgrade')?'UP':type.startsWith('Inspection')?'IN':type.startsWith('Event')?'EV':'RM';let nums=workOrders.filter(w=>w.id.includes('-'+p+'-')).map(w=>parseInt(w.id.split('-').pop())).filter(Number.isFinite);return 'BCTP-'+p+'-'+(Math.max(2500,...nums)+1)}
function createWO(){if(!fTitle.value.trim()||!fLocation.value.trim()){toast('Title and location are required');return}let id=newId(fType.value);workOrders.unshift({id,type:fType.value,title:fTitle.value.trim(),asset:fAsset.value,location:fLocation.value.trim(),priority:fPriority.value,assigned:fAssigned.value,status:'Requested',scheduled:fScheduled.value,due:fDue.value||'Unscheduled',overdue:false,description:fDescription.value,notes:[],labor:[],parts:[],created:new Date().toISOString(),completed:null});save();render();openDetail(id);toast(id+' created')}
function openDetail(id){activeWO=id;let w=workOrders.find(x=>x.id===id);woDetailBody.innerHTML=`<button class="btn secondary" onclick="show('workorders')">← Work Orders</button><div class="card" style="margin-top:10px"><div class="small">${esc(w.type)}</div><h2>${esc(w.id)}</h2><h3>${esc(w.title)}</h3><span class="pill">${esc(w.status)}</span><div class="detail">Asset <strong style="float:right">${esc(w.asset||'Facility / General')}</strong></div><div class="detail">Location <strong style="float:right">${esc(w.location)}</strong></div><div class="detail">Assigned <strong style="float:right">${esc(w.assigned)}</strong></div><div class="detail">Due <strong style="float:right">${esc(w.due)}</strong></div><p>${esc(w.description||'No description entered.')}</p><div class="actions"><button class="btn secondary" onclick="duplicateWO()">⧉ Duplicate</button><button class="btn dark" onclick="completeWO()">✓ Complete</button></div></div><div class="sectionTitle">Field Notes</div>${(w.notes||[]).map(n=>`<div class="note">${esc(n)}</div>`).join('')||'<div class="small">No notes yet.</div>'}`;show('woDetail')}
function duplicateWO(){let w=workOrders.find(x=>x.id===activeWO),c=JSON.parse(JSON.stringify(w));c.id=newId(w.type);c.title=w.title+' — Copy';c.status='Requested';c.notes=[];c.labor=[];c.parts=[];c.overdue=false;c.completed=null;c.created=new Date().toISOString();workOrders.unshift(c);save();render();openDetail(c.id);toast('Duplicated as '+c.id)}
function completeWO(){let w=workOrders.find(x=>x.id===activeWO);w.status='Completed';w.overdue=false;w.completed=new Date().toISOString();w.notes=(w.notes||[]);w.notes.push('Work completed by Shane Kelley.');save();render();openDetail(w.id);toast('Work order completed')}
function toggleSelect(){selecting=!selecting;selected.clear();selectBtn.textContent=selecting?'Cancel Selection':'Select Multiple';closeSelected.style.display=selecting?'block':'none';closeSelected.textContent='Close Selected';render()}
function selectWO(id,on){on?selected.add(id):selected.delete(id);closeSelected.textContent='Close Selected ('+selected.size+')'}
function bulkClose(){if(!selected.size){toast('Select at least one work order');return}modalBody.innerHTML=`<h2>Close ${selected.size} Work Orders</h2><div class="form"><label>Closeout note</label><textarea id="closeNote" placeholder="Optional note"></textarea><button class="btn full" onclick="confirmBulkClose()">Close Selected Work Orders</button><button class="btn secondary full" style="margin-top:8px" onclick="modal.style.display='none'">Cancel</button></div>`;modal.style.display='flex'}
function confirmBulkClose(){let note=document.getElementById('closeNote').value,now=new Date().toISOString();workOrders.forEach(w=>{if(selected.has(w.id)){w.status='Verified / Closed';w.overdue=false;w.completed=w.completed||now;w.closedAt=now;w.closedBy='Shane Kelley';w.notes=w.notes||[];w.notes.push('Bulk closed by Shane Kelley'+(note?' — '+note:''))}});selecting=false;selected.clear();save();modal.style.display='none';selectBtn.textContent='Select Multiple';closeSelected.style.display='none';render();toast('Selected work orders closed')}
function openAssetCreate(){['aId','aName','aLocation','aManufacturer','aModel','aSerial','aVendor','aNotes'].forEach(id=>document.getElementById(id).value='');show('assetCreate')}
function saveAsset(){let id=aId.value.trim(),name=aName.value.trim();if(!id||!name){toast('Asset ID and Asset Name are required');return}if(assets.some(a=>a.id.toLowerCase()===id.toLowerCase())){toast('That Asset ID already exists');return}assets.unshift({id,name,category:aCategory.value,location:aLocation.value,manufacturer:aManufacturer.value,model:aModel.value,serial:aSerial.value,criticality:aCriticality.value,status:aStatus.value,vendor:aVendor.value,notes:aNotes.value,created:new Date().toISOString()});save();render();show('assets');toast('Asset '+id+' added')}
function loadImage(input,key,target,bg=false){input.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return,r=new FileReader();r.onload=()=>{localStorage.setItem(key,r.result);if(bg){target.style.backgroundImage=`url("${r.result}")`;target.classList.add('hasPhoto')}else target.innerHTML=`<img src="${r.result}">`};r.readAsDataURL(f)})}
loadImage(logoUpload,'k1_venue_logo',venueLogo);loadImage(headerUpload,'k1_header_bg',document.querySelector('.top'),true);
let lg=localStorage.getItem('k1_venue_logo');if(lg)venueLogo.innerHTML=`<img src="${lg}">`;let bg=localStorage.getItem('k1_header_bg');if(bg){document.querySelector('.top').style.backgroundImage=`url("${bg}")`;document.querySelector('.top').classList.add('hasPhoto')}
render();
</script></body></html>
